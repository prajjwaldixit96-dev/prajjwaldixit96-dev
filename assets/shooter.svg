<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="420"
     viewBox="0 0 900 420">

<defs>

    <filter id="glow">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

</defs>

<!-- BACKGROUND -->

<rect width="900" height="420"
      rx="15"
      fill="#050816"/>


<!-- HEADER -->

<rect x="20"
      y="18"
      width="860"
      height="55"
      rx="10"
      fill="#0b1224"
      stroke="#00e5ff"
      stroke-width="2"/>

<text x="45"
      y="53"
      font-family="monospace"
      font-size="24"
      font-weight="bold"
      fill="#00e5ff">

⚡ DEVELOPER SPACE SHOOTER

</text>

<text x="720"
      y="53"
      font-family="monospace"
      font-size="18"
      fill="#ffe600">

SCORE 00000

</text>


<!-- GAME BORDER -->

<rect x="20"
      y="88"
      width="860"
      height="290"
      rx="12"
      fill="#02040b"
      stroke="#183b62"
      stroke-width="2"/>


<!-- STARS -->

<g fill="#ffffff">

<circle cx="80" cy="110" r="2">
    <animate attributeName="cy"
             values="100;370;100"
             dur="2s"
             repeatCount="indefinite"/>
</circle>

<circle cx="170" cy="160" r="1.5">
    <animate attributeName="cy"
             values="90;370;90"
             dur="3s"
             repeatCount="indefinite"/>
</circle>

<circle cx="300" cy="120" r="2">
    <animate attributeName="cy"
             values="100;370;100"
             dur="2.4s"
             repeatCount="indefinite"/>
</circle>

<circle cx="600" cy="150" r="2">
    <animate attributeName="cy"
             values="90;370;90"
             dur="2.7s"
             repeatCount="indefinite"/>
</circle>

<circle cx="790" cy="110" r="1.5">
    <animate attributeName="cy"
             values="80;370;80"
             dur="3.2s"
             repeatCount="indefinite"/>
</circle>

</g>


<!-- ENEMY GROUP 1 -->

<g filter="url(#glow)">

<g>

<animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;180 40;360 0;180 40;0 0"
    dur="5s"
    repeatCount="indefinite"/>

<path d="
M0 12
C0 2 10 -5 22 -5
C34 -5 44 2 44 12
L38 28
L30 22
L22 28
L14 22
L6 28
Z"
fill="#ff315d"/>

<circle cx="13" cy="10" r="4"
fill="#050816"/>

<circle cx="31" cy="10" r="4"
fill="#050816"/>

</g>

</g>


<!-- ENEMY GROUP 2 -->

<g filter="url(#glow)">

<g>

<animateTransform
    attributeName="transform"
    type="translate"
    values="650 110;520 170;650 230;780 170;650 110"
    dur="4s"
    repeatCount="indefinite"/>

<path d="
M0 12
C0 2 10 -5 22 -5
C34 -5 44 2 44 12
L38 28
L30 22
L22 28
L14 22
L6 28
Z"
fill="#a855f7"/>

<circle cx="13" cy="10" r="4"
fill="#050816"/>

<circle cx="31" cy="10" r="4"
fill="#050816"/>

</g>

</g>


<!-- SHOOTING BULLETS -->

<g fill="#ff00aa"
   filter="url(#glow)">

<rect x="448"
      y="300"
      width="5"
      height="25"
      rx="3">

<animate attributeName="y"
         values="300;105;300"
         dur="1s"
         repeatCount="indefinite"/>

</rect>


<rect x="500"
      y="320"
      width="5"
      height="25"
      rx="3">

<animate attributeName="y"
         values="320;120;320"
         dur="1.2s"
         repeatCount="indefinite"/>

</rect>

</g>


<!-- EXPLOSION -->

<g>

<circle cx="590"
        cy="190"
        r="8"
        fill="none"
        stroke="#ffe600"
        stroke-width="4">

<animate attributeName="r"
         values="5;35;5"
         dur="1s"
         repeatCount="indefinite"/>

<animate attributeName="opacity"
         values="1;0;1"
         dur="1s"
         repeatCount="indefinite"/>

</circle>

<circle cx="590"
        cy="190"
        r="4"
        fill="#ff6b00">

<animate attributeName="r"
         values="3;18;3"
         dur="1s"
         repeatCount="indefinite"/>

</circle>

</g>


<!-- PLAYER SHIP -->

<g filter="url(#glow)">

<polygon
points="450,300 420,355 450,342 480,355"
fill="#00e5ff"
stroke="#ffffff"
stroke-width="2">

<animateTransform
attributeName="transform"
type="translate"
values="-250 0;250 0;-250 0"
dur="5s"
repeatCount="indefinite"/>

</polygon>

<!-- cockpit -->

<ellipse
cx="450"
cy="326"
rx="7"
ry="12"
fill="white">

<animateTransform
attributeName="transform"
type="translate"
values="-250 0;250 0;-250 0"
dur="5s"
repeatCount="indefinite"/>

</ellipse>

<!-- engine -->

<polygon
points="442,345 450,375 458,345"
fill="#ff5e00">

<animateTransform
attributeName="transform"
type="translate"
values="-250 0;250 0;-250 0"
dur="5s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values="1;.3;1"
dur=".2s"
repeatCount="indefinite"/>

</polygon>

</g>


<!-- MORE BULLETS FROM PLAYER -->

<rect x="448"
      y="275"
      width="4"
      height="20"
      rx="2"
      fill="#00e5ff"
      filter="url(#glow)">

<animate attributeName="y"
         values="275;100;275"
         dur=".9s"
         repeatCount="indefinite"/>

<animateTransform
attributeName="transform"
type="translate"
values="-250 0;250 0;-250 0"
dur="5s"
repeatCount="indefinite"/>

</rect>


<!-- HIT FLASH -->

<rect x="400"
      y="105"
      width="100"
      height="210"
      fill="#00e5ff"
      opacity="0">

<animate
attributeName="opacity"
values="0;0;.12;0;0"
dur="2s"
repeatCount="indefinite"/>

</rect>


<!-- BOTTOM -->

<text x="450"
      y="402"
      text-anchor="middle"
      font-family="monospace"
      font-size="14"
      fill="#00e5ff">

AUTO-RUNNING • SHOOT • DESTROY • SURVIVE

</text>

</svg>
