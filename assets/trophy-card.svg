  </style>
  <rect x="0.5" y="0.5" width="599" height="159" rx="12" fill="#0f1017" stroke="#414868"/>
  
  <g transform="translate(20,20)">
    <rect width="130" height="120" rx="10" fill="#1a1b27" stroke="#565f89" stroke-width="2"/>
    <text x="65" y="30" text-anchor="middle" class="label">Stars</text>
    <text x="65" y="72" text-anchor="middle" class="tier" fill="#565f89">C</text>
    <text x="65" y="100" text-anchor="middle" class="value">0</text>
  </g>
  <g transform="translate(160,20)">
