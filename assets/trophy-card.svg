<svg width="600" height="160" viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label { font: 500 13px 'Segoe UI', sans-serif; fill: #c0caf5; }
    .value { font: 400 12px 'Segoe UI', sans-serif; fill: #9aa5ce; }
