<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Developer Space Shooter</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050816;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(circle at 20% 20%, #101b3c 0%, transparent 25%),
        radial-gradient(circle at 80% 70%, #17113b 0%, transparent 25%),
        #050816;
}

/* Stars */

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: starMove linear infinite;
}

@keyframes starMove {

    from {
        transform: translateY(-20px);
    }

    to {
        transform: translateY(110vh);
    }

}

/* Header */

#header {

    position: absolute;
    top: 15px;
    left: 20px;
    right: 20px;

    display: flex;
    justify-content: space-between;

    padding: 12px 18px;

    border: 1px solid #00e5ff;
    border-radius: 10px;

    background: rgba(5, 8, 22, 0.8);

    box-shadow:
        0 0 15px rgba(0,229,255,.3);

    z-index: 10;
}

.title {
    color: #00e5ff;
    font-weight: bold;
    letter-spacing: 2px;
}

#score {
    color: #fff;
}

/* Player */

#player {

    position: absolute;

    width: 0;
    height: 0;

    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 45px solid #00e5ff;

    filter:
        drop-shadow(0 0 8px #00e5ff)
        drop-shadow(0 0 20px #00e5ff);

    z-index: 5;
}

/* Player cockpit */

#player::after {

    content: "";

    position: absolute;

    width: 8px;
    height: 15px;

    background: white;

    left: -4px;
    top: 18px;

    border-radius: 5px;

}

/* Bullet */

.bullet {

    position: absolute;

    width: 4px;
    height: 18px;

    background: #ff00aa;

    border-radius: 5px;

    box-shadow:
        0 0 8px #ff00aa,
        0 0 18px #ff00aa;

}

/* Enemy */

.enemy {

    position: absolute;

    width: 42px;
    height: 28px;

    background: #ff3355;

    border-radius: 50%;

    box-shadow:
        0 0 10px #ff3355,
        0 0 25px #ff3355;

}

.enemy::before,
.enemy::after {

    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    background: #050816;

    border-radius: 50%;

    top: 8px;

}

.enemy::before {
    left: 8px;
}

.enemy::after {
    right: 8px;
}

.enemy span {

    position: absolute;

    bottom: -7px;

    width: 12px;
    height: 8px;

    background: #ff9d00;

    border-radius: 50%;

    left: 15px;

}

/* Explosion */

.explosion {

    position: absolute;

    width: 15px;
    height: 15px;

    border: 3px solid #ffe600;

    border-radius: 50%;

    animation: explode .4s forwards;

}

@keyframes explode {

    from {
        transform: scale(1);
        opacity: 1;
    }

    to {
        transform: scale(5);
        opacity: 0;
    }

}

/* Bottom */

#status {

    position: absolute;

    bottom: 15px;
    left: 20px;
    right: 20px;

    text-align: center;

    color: #00e5ff;

    font-size: 13px;

    letter-spacing: 2px;

    opacity: .8;

}

</style>
</head>

<body>

<div id="game">

    <div id="header">

        <div class="title">
            ⚡ DEVELOPER SPACE SHOOTER
        </div>

        <div id="score">
            SCORE: 00000
        </div>

    </div>

    <div id="player"></div>

    <div id="status">
        AUTO RUNNING • PYTHON • DJANGO • JAVASCRIPT
    </div>

</div>


<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");

let score = 0;

let playerX = window.innerWidth / 2;
let playerY = window.innerHeight - 90;

let direction = 1;

let bullets = [];
let enemies = [];


// -------------------------
// CREATE STARS
// -------------------------

for (let i = 0; i < 100; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDuration =
        (2 + Math.random() * 5) + "s";

    star.style.animationDelay =
        Math.random() * 5 + "s";

    game.appendChild(star);

}


// -------------------------
// PLAYER
// -------------------------

function updatePlayer() {

    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}

updatePlayer();


// -------------------------
// SHOOT
// -------------------------

function shoot() {

    const bullet =
        document.createElement("div");

    bullet.className = "bullet";

    let x = playerX - 2;

    let y = playerY - 20;

    bullet.style.left = x + "px";

    bullet.style.top = y + "px";

    game.appendChild(bullet);

    bullets.push({
        element: bullet,
        x: x,
        y: y
    });

}


// -------------------------
// CREATE ENEMY
// -------------------------

function createEnemy() {

    const enemy =
        document.createElement("div");

    enemy.className = "enemy";

    const flame =
        document.createElement("span");

    enemy.appendChild(flame);

    let x =
        50 +
        Math.random() *
        (window.innerWidth - 100);

    let y = -40;

    enemy.style.left =
        x + "px";

    enemy.style.top =
        y + "px";

    game.appendChild(enemy);

    enemies.push({

        element: enemy,

        x: x,

        y: y,

        speed:
            1.5 +
            Math.random() * 2

    });

}


// -------------------------
// EXPLOSION
// -------------------------

function explosion(x, y) {

    const e =
        document.createElement("div");

    e.className = "explosion";

    e.style.left =
        x + "px";

    e.style.top =
        y + "px";

    game.appendChild(e);

    setTimeout(() => {

        e.remove();

    }, 400);

}


// -------------------------
// COLLISION
// -------------------------

function collision(a, b) {

    return (

        a.x < b.x + 42 &&

        a.x + 4 > b.x &&

        a.y < b.y + 28 &&

        a.y + 18 > b.y

    );

}


// -------------------------
// GAME LOOP
// -------------------------

function gameLoop() {

    // Player automatic movement

    playerX += direction * 2.2;

    if (
        playerX >
        window.innerWidth - 35
    ) {

        direction = -1;

    }

    if (playerX < 35) {

        direction = 1;

    }

    updatePlayer();


    // Bullets

    bullets.forEach((bullet, bi) => {

        bullet.y -= 9;

        bullet.element.style.top =
            bullet.y + "px";


        if (bullet.y < -30) {

            bullet.element.remove();

            bullets.splice(bi, 1);

            return;

        }


        // Enemy collision

        enemies.forEach((enemy, ei) => {

            if (
                bullet &&
                enemy &&
                collision(bullet, enemy)
            ) {

                explosion(
                    enemy.x,
                    enemy.y
                );

                enemy.element.remove();

                bullet.element.remove();

                enemies.splice(ei, 1);

                bullets.splice(bi, 1);

                score += 100;

                scoreText.innerText =
                    "SCORE: " +
                    String(score).padStart(5, "0");

            }

        });

    });


    // Enemies

    enemies.forEach((enemy, ei) => {

        enemy.y += enemy.speed;

        enemy.element.style.top =
            enemy.y + "px";


        // Enemy reaches bottom

        if (
            enemy.y >
            window.innerHeight + 50
        ) {

            enemy.element.remove();

            enemies.splice(ei, 1);

        }

    });


    requestAnimationFrame(gameLoop);

}


// -------------------------
// AUTO FIRE
// -------------------------

setInterval(() => {

    shoot();

}, 350);


// -------------------------
// AUTO ENEMIES
// -------------------------

setInterval(() => {

    createEnemy();

}, 650);


// Start game automatically

gameLoop();


// Responsive

window.addEventListener(
    "resize",
    () => {

        playerY =
            window.innerHeight - 90;

    }
);

</script>

</body>
</html>
